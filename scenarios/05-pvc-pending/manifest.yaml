apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-pvc-pending
  namespace: nudgebee-demo
  labels:
    app.kubernetes.io/part-of: nudgebee-demo
    nudgebee.io/demo-scenario: pvc-pending
spec:
  storageClassName: does-not-exist
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-pvc-pending
  namespace: nudgebee-demo
  labels:
    app.kubernetes.io/part-of: nudgebee-demo
    nudgebee.io/demo-scenario: pvc-pending
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-pvc-pending
  template:
    metadata:
      labels:
        app: demo-pvc-pending
        app.kubernetes.io/part-of: nudgebee-demo
        nudgebee.io/demo-scenario: pvc-pending
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: demo-pvc-pending
